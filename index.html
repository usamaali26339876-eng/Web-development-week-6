<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise — Interactive Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>SpendWise</h1>
      <p class="subtitle">Track expenses, monitor your budget, and stay in control.</p>
    </header>

    <!-- Budget Setup & Status Banner -->
    <section class="card budget-section">
      <div class="budget-header">
        <h2>Monthly Budget</h2>
        <form id="budget-form" class="inline-form">
          <label for="budget-input" class="sr-only">Set Budget</label>
          <input
            type="number"
            id="budget-input"
            placeholder="Set budget (e.g. 500)"
            min="1"
            step="0.01"
            required
          />
          <button type="submit" class="btn btn-secondary">Update Budget</button>
        </form>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Total Budget</span>
          <span id="total-budget" class="stat-value">$0.00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Total Spent</span>
          <span id="total-spent" class="stat-value">$0.00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Remaining</span>
          <span id="remaining-balance" class="stat-value">$0.00</span>
        </div>
      </div>

      <!-- Conditional Budget Feedback -->
      <div id="budget-status" class="status-banner status-ok" role="status">
        Set a budget and add expenses to see your budget status.
      </div>
    </section>

    <!-- Add Expense Form -->
    <section class="card">
      <h2>Add New Expense</h2>
      <form id="expense-form" class="expense-form">
        <div class="form-group">
          <label for="expense-title">Description</label>
          <input
            type="text"
            id="expense-title"
            placeholder="e.g., Groceries, Transport, Airtime"
            required
          />
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount</label>
          <input
            type="number"
            id="expense-amount"
            placeholder="0.00"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Add Expense</button>
      </form>
    </section>

    <!-- Filter & Expense Records -->
    <section class="card">
      <div class="list-header">
        <h2>Expense Records (<span id="expense-count">0</span>)</h2>
        <div class="filter-controls">
          <label for="category-filter" class="sr-only">Filter by Category</label>
          <select id="category-filter">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <button type="button" id="clear-all-btn" class="btn btn-danger-outline">
            Clear All
          </button>
        </div>
      </div>

      <ul id="expense-list" class="expense-list">
        <li class="empty-state">No expenses recorded yet. Add one above!</li>
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
